version: "3.9"

services:

  backend: 
    build: .
    ports:
      - 8000:8000

    env_file:
      - .env.docker

    depends_on:
      - db


  db:

    image: postgres:15

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: creator_intelligence

    ports: 
    - "5432:5432"    